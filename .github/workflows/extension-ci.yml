name: extension-ci

run-name: extension-ci | ${{ github.event.pull_request.title || github.ref_name }}

on:
  pull_request:
    paths: ["apps/extension/**", ".github/workflows/extension-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/extension/**", ".github/workflows/extension-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/extension/.nvmrc
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
