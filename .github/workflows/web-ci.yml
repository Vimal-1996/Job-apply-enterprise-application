name: web-ci

run-name: web-ci | ${{ github.event.pull_request.title || github.ref_name }}

on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Public, non-secret client settings needed at build time.
      VITE_COGNITO_AUTHORITY: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_kCc9mo8FP
      VITE_COGNITO_CLIENT_ID: 2vvuu6ucikoeidtdc6sl4kapl1
      VITE_COGNITO_DOMAIN: https://job-apply-dev-418272768931.auth.us-east-1.amazoncognito.com
      VITE_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
